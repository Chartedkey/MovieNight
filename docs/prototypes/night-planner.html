-content:space-between}.muted{color:var(--muted)}.intro{margin:6px 0 20px;max-width:850px}.demo{border-left:3px solid var(--gold);background:#252117;padding:10px 14px;color:#e2c992;font-size:12px;margin-bottom:24px}.steps{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}.step{background:transparent;color:var(--muted);border-color:transparent}.step.active{background:#29251e;color:var(--gold);border-color:#544328}.step span{margin-right:8px;font-size:11px;border:1px solid currentColor;border-radius:50%;padding:1px 6px}.settings{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:18px 20px;margin-bottom:24px}.settings-grid{display:grid;grid-template-columns:1.5fr .7fr .9fr .7fr 1fr;gap:14px}.extras{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}.extras label{display:flex;gap:7px;align-items:center}.extras button{margin-left:auto}.mix{margin-top:12px;max-width:280px}.section-heading{margin:12px 0 14px}.slot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.slot.locked{border-color:#8c6c31}.slot-head{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.slot-num{font-size:22px;color:var(--gold);font-weight:300;line-height:1}.slot-head h3{font-size:13px;flex:1}.lock{font-size:12px;color:var(--muted);border-color:transparent;background:transparent;padding:6px}.locked .lock{color:var(--gold);background:#30291d}.filters{padding:14px 17px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-bottom:1px solid #2c3036}.filters label{font-size:11px}.filters select{font-size:12px;min-height:35px;padding:6px}.film-body{padding:17px;display:flex;gap:15px;min-height:177px}.poster{width:91px;min-width:91px;height:133px;border-radius:6px;background:linear-gradient(145deg,var(--cover),#12151b 90%);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px;box-shadow:0 5px 16px #0004}.poster:before{content:"";position:absolute;border:1px solid #ffffff30;width:100px;height:100px;transform:rotate(35deg);top:30px;left:28px}.poster b{font-family:Georgia,serif;font-size:15px;line-height:1.2;position:relative;overflow-wrap:anywhere}.poster small{font-size:9px;letter-spacing:1px;position:relative}.film-info{min-width:0;flex:1}.film-info h3{line-height:1.25;margin-bottom:5px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{font-size:10px;border-radius:4px;background:#2b3036;color:#c3c7cd;padding:3px 6px}.tag.ok{background:#25352b;color:var(--green)}.tag.gold{background:#352e1e;color:#e6c77e}.tag.warn{color:var(--red);background:#392a28}.reasons{font-size:11px;color:#bbb6a9;margin-top:9px;line-height:1.4}.actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 17px 16px}.actions .small{font-size:11px}.empty{padding:30px 20px;min-height:177px;color:var(--muted);width:100%;text-align:center}.summary{margin-top:22px;padding:18px 20px;background:#211f19;border:1px solid #514429;border-radius:12px;position:sticky;bottom:12px;box-shadow:0 8px 25px #0007;z-index:2}.time{font-size:24px;font-weight:700;letter-spacing:-.5px}.summary small{color:var(--muted)}.summary .row{gap:16px}.alert{border:1px solid #654434;background:#30231e;color:#f2c2ac;padding:13px 16px;border-radius:8px;margin-bottom:18px;font-size:13px}.success{background:#202d24;border:1px solid #3c5d43;color:#b4d2b6;padding:12px 16px;border-radius:8px;margin:16px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:30;background:var(--gold);color:#19150b;padding:12px 20px;border-radius:9px;box-shadow:0 6px 22px #0008;font-weight:600;max-width:90vw}.checklist{display:flex;flex-direction:column;gap:13px;margin-top:20px}.check-card{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:12px}.check-title{display:flex;gap:14px;align-items:flex-start}.check-num{color:var(--gold);font-size:21px;min-width:22px}.tasks{margin:12px 0 0 36px;display:flex;flex-direction:column;gap:9px}.tasks label{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--text)}.result{margin:14px 0 0 36px;display:flex;flex-wrap:wrap;gap:8px}.result .chosen{border-color:var(--gold);background:#342c1b;color:var(--gold)}.review-detail{margin:14px 0 0 36px;border-top:1px solid var(--line);padding-top:12px}.review-detail select{width:150px}.aside-note{margin:20px 0;font-size:12px;color:var(--muted)}.overlay{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:760px;max-width:100%;max-height:86vh;overflow:auto;background:#191d22;border:1px solid var(--line);border-radius:14px;padding:24px}.choices{display:flex;flex-direction:column;gap:10px;margin-top:18px}.choice{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center}.choice>div{flex:1}.choice .meta{font-size:11px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.info-box{border:1px solid var(--line);border-radius:9px;padding:14px}.info-box strong{color:var(--gold)}.plain-list{line-height:1.8;color:var(--muted);padding-left:20px}.footer-note{font-size:11px;color:#797f88;margin-top:25px}details summary{cursor:pointer;color:var(--muted)}.favorites{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.favorite.on{border-color:var(--gold);color:var(--gold)}.template{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.template select{width:220px}.empty-plan{padding:70px 20px;text-align:center;background:var(--panel);border-radius:12px}.empty-plan p{margin:10px 0 20px;color:var(--muted)}

function sourcePass(f,sl){const src=sl.source==='inherit'?S.source:sl.source;if(src==='near')return f.near&&f.status!=='rewatch';if(src==='rest')return !f.near&&f.status!=='rewatch';if(src==='rewatch')return f.status==='rewatch';return f.status!=='rewatch'||S.rewatch;}

function total(ids=S.slots.map(s=>s.film)){return ids.reduce((n,id)=>n+(byId(id)?.runtime||0),0)+Math.max(0,ids.filter(Boolean).length-1)*S.pause;}
function problems(ids=S.slots.map(s=>s.film)){const films=ids.map(byId).filter(Boolean),errors=[];if(films.length!==S.count)errors.push('Заполните все места или нажмите «Подобрать ночь».');if(new Set(ids.filter(Boolean)).size!==films.length)errors.push('Один фильм выбран дважды.');if(!S.repeat&&new Set(films.map(f=>f.director)).size!==films.length)errors.push('Есть повтор режиссёра. Разрешите его или замените фильм.');if(S.limit&&total(ids)>S.limit)errors.push(`План длиннее лимита на ${total(ids)-S.limit} мин, включая перерывы.`);ids.forEach((id,i)=>{if(id&&!eligible(byId(id),S.slots[i]))errors.push(`Место ${i+1}: фильм не соответствует текущим условиям.`);});if(S.source==='mix'&&films.length===S.count&&films.filter(f=>f.near).length!==S.nearCount)errors.push(`В смеси должно быть ровно ${S.nearCount} из «Ближайших».`);return errors;}
function score(f,i){const noise=((f.id*37+S.seed*17+i*23)%97)/97;return (f.available?50:0)+(f.status==='queue'?12:0)+(f.wish?9:0)+(S.source==='nearfirst'&&f.near?25:0)+noise*8;}
function solve(replace=null){const ids=S.slots.map((sl,i)=>((sl.locked||replace!==null&&i!==replace)?sl.film:null));if(S.slots.some((sl,i)=>sl.locked&&!sl.film)){notice='Сначала выберите фильм для закреплённого места.';return false;}
 const pools=S.slots.map((sl,i)=>ids[i]?[byId(ids[i])]:D.filter(f=>eligible(f,sl)&&!(replace===i&&f.id===sl.film)).sort((a,b)=>score(b,i)-score(a,i)));
 if(pools.some(p=>!p.length)){notice=`Для места ${pools.findIndex(p=>!p.length)+1} нет подходящих демонстрационных фильмов. Измените жанр, регион, режиссёра или источник.`;return false;}
 let best=null,bestScore=-Infinity,nodes=0;const order=[...ids.keys()].sort((a,b)=>pools[a].length-pools[b].length),picked=Array(S.count).fill(null);
 function search(depth,time,sum,used,dirs,near){if(++nodes>80000)return;if(depth===order.length){if(S.source==='mix'&&near!==S.nearCount)return;if(sum>bestScore){bestScore=sum;best=picked.slice();}return;}const i=order[depth];for(const f of pools[i]){if(!eligible(f,S.slots[i])||used.has(f.id)||(!S.repeat&&dirs.has(f.director)))continue;const t=time+f.runtime+(depth?S.pause:0),n=near+Number(f.near);if(S.limit&&t>S.limit)continue;if(S.source==='mix'&&(n>S.nearCount||n+(S.count-depth-1)<S.nearCount))continue;picked[i]=f.id;search(depth+1,t,sum+score(f,i),new Set([...used,f.id]),new Set([...dirs,f.director]),n);}}
 search(0,0,0,new Set(),new Set(),0);if(!best){notice='Подходящий набор не подобран. Попробуйте увеличить время, разрешить повтор режиссёра или ослабить условие одного места. Закреплённые фильмы остаются на месте.';return false;}S.slots.forEach((s,i)=>s.film=best[i]);notice='';persist();return true;}
function reason(f){return [f.near?'из ближайших':labels[f.status].toLowerCase(),f.available?'файл уже есть':'нужно скачать',f.wish?'отмечен «Хочу»':null,S.favorites.includes(f.director)?'любимый режиссёр':null].filter(Boolean).join(' · ');}
function poster(f){return `<div class="poster" style="--cover:${f.color}" aria-hidden="true"><small>MOVIE NIGHT<br>${f.year}</small><b>${esc(f.title)}</b></div>`;}
function filmHtml(f){return `${poster(f)}<div class="film-info"><h3>${esc(f.title)}</h3><div class="meta">${f.year} · ${esc(f.director)}</div><div class="meta">${f.runtime} мин (${dur(f.runtime)}) · ${f.country}</div><div class="tags"><span class="tag ${f.available?'ok':'warn'}">${f.available?(f.today?'В «Сегодня»':'На диске'):'Нужно скачать'}</span><span class="tag gold">${labels[f.weight]}</span><span class="tag">${labels[f.attention]||'Внимание: среднее'}</span>${f.near?'<span class="tag">Ближайшие</span>':''}${(f.styles||[]).map(v=>`<span class="tag">${v==='noir'?'Нуар':'Неонуар'}</span>`).join('')}</div><div class="reasons">${esc(reason(f))}</div></div>`;}
function slotHtml(sl,i){const f=byId(sl.film);return `<article class="slot ${sl.locked?'locked':''}" data-slot-card="${i}"><div class="slot-head"><span class="slot-num">0${i+1}</span><h3>${['Начало вечера','Продолжение','Вторая половина','Финальный фильм'][i]||'Следующий фильм'}</h3><button class="lock" data-action="lock" data-i="${i}" aria-pressed="${sl.locked}" ${!f?'disabled':''}>${sl.locked?'◆ Закреплён':'◇ Закрепить'}</button><button class="small ghost" data-action="up" data-i="${i}" ${i===0?'disabled':''} aria-label="Переместить место ${i+1} выше">↑</button></div><div class="filters">${field('Источник','source',[['inherit','Как для всей ночи'],['near','Ближайшие'],['rest','Остальная библиотека'],['rewatch','Пересмотреть']],sl.source,i)}${field('Жанр','genre',[['any','Любой'],['drama','Драма'],['western','Вестерн'],['crime','Криминал'],['thriller','Триллер'],['crime-thriller','Криминал + триллер'],['noir','Нуар'],['neonoir','Неонуар'],['comedy','Комедия'],['animation','Анимация']],sl.genre,i)}${field('Кинематограф','region',[['any','Любой'],['asia','Азиатское кино'],['europe','Европейское кино'],['США','Американское кино']],sl.region,i)}${field('Эмоциональная нагрузка','weight',[['any','Неважно'],['light','Лёгкий'],['medium','Средний'],['heavy','Тяжёлый']],sl.weight,i)}${field('Внимание сегодня','attention',[['any','Неважно'],['easy','Не хочу вникать'],['medium','Среднее'],['focused','Готов сосредоточиться']],sl.attention,i)}${field('Режиссёр','director',[['any','Любой'],...directors.map(d=>[d,(S.favorites.includes(d)?'★ ':'')+d])],sl.director,i)}</div><div class="film-body">${f?filmHtml(f):'<div class="empty">Здесь будет фильм под твои условия.<br>Подбери ночь или выбери вручную.</div>'}</div><div class="actions"><button class="small" data-action="choose" data-i="${i}">${f?'Выбрать другой вручную':'Выбрать фильм'}</button><button class="small ghost" data-action="replace" data-i="${i}" ${!f||sl.locked?'disabled':''}>Другой вариант</button>${f?`<button class="small ghost" data-action="edit-tags" data-i="${i}">Мои отметки</button>`:''}</div></article>`;}
function planHtml(){const ids=S.slots.map(s=>s.film),filled=ids.filter(Boolean).length,errs=problems(),minutes=total();return `<div class="row between"><div><div class="eyebrow">Твой вечер · твои правила</div><h1>Собрать ночь</h1></div><button class="ghost" data-action="about">Как попробовать макет</button></div><p class="intro muted">Выбери настроение и источники. Закрепи то, что уже решил посмотреть, — остальное подберём вокруг.</p><section class="settings"><div class="settings-grid">${field('Откуда подбирать','source',[['nearfirst','Сначала ближайшие'],['near','Только ближайшие'],['all','Вся библиотека'],['mix','Смесь источников']],S.source)}${field('Фильмов за ночь','count',[1,2,3,4,5,6].map(n=>[n,n+(n===1?' фильм':n<5?' фильма':' фильмов')]),S.count)}<label>Лимит минут, 0 — без лимита<input type="number" min="0" max="1440" step="1" data-setting="limit" value="${S.limit}" aria-describedby="limit-hours"><span id="limit-hours" class="meta" style="display:block;color:var(--gold)" aria-live="polite">${S.limit?dur(S.limit):'Без ограничения по времени'}</span></label>${field('Перерыв','pause',[[0,'Без перерывов'],[5,'5 минут'],[10,'10 минут'],[15,'15 минут']],S.pause)}${field('Режиссёры','mode',[['any','Любые'],['favorites','Из любимых']],S.mode)}</div>${S.source==='mix'?`<div class="mix">${field('Сколько из «Ближайших»','nearCount',Array.from({length:S.count+1},(_,n)=>[n,`${n} из ближайших + ${S.count-n} из остальных`]),S.nearCount)}</div>`:''}<div class="extras">${field('Наличие файла','availability',[['prefer','Предпочитать скачанные'],['only','Только скачанные']],S.availability)}<label><input type="checkbox" data-setting="repeat" ${S.repeat?'checked':''}> Разрешить повтор режиссёра</label><label><input type="checkbox" data-setting="rewatch" ${S.rewatch?'checked':''}> Добавлять пересмотр</label><button class="small ghost" data-action="favorites">★ Мои любимые</button></div><div class="template"><select id="template-select" aria-label="Сохранённый шаблон"><option value="">Мои шаблоны</option>${S.templates.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select><button class="small ghost" data-action="save-template">Сохранить настройки</button><button class="small ghost" data-action="load-template">Применить</button></div></section>${notice?`<div class="alert" role="alert">${esc(notice)}</div>`:''}<div class="row between section-heading"><h2>Порядок фильмов</h2><span class="muted" style="font-size:12px">Твои отметки нагрузки в этом макете — условные примеры</span></div><div class="slot-grid">${S.slots.map(slotHtml).join('')}</div><div class="summary"><div class="row between"><div><span class="time">${filled?dur(minutes):'Ночь ещё не собрана'}</span><br><small>${filled} из ${S.count} фильмов · перерывы ${Math.max(0,filled-1)*S.pause} мин${S.limit?` · ${minutes<=S.limit?'останется '+dur(S.limit-minutes):'выход за лимит '+dur(minutes-S.limit)}`:''}</small></div><div class="row"><button data-action="generate">${filled?'Пересобрать свободные':'Подобрать ночь'}</button><button class="primary" data-action="approve" ${errs.length?'disabled':''}>Утвердить ночь →</button></div></div>${errs.length&&filled?`<div class="meta" style="color:var(--red);margin-top:8px">${esc(errs[0])}</div>`:''}</div>`;}
function prepTasks(f){return [{key:'file',text:f.available?(f.today?'Уже лежит в «Сегодня»':'Перенести в «Сегодня» с другого диска'):'Скачать фильм и положить в «Сегодня»',done:f.available&&f.today},...(f.id===4?[{key:'copies',text:'Проверить две копии: «Сегодня» и основной диск',done:false}]:[]),{key:'subs',text:f.subs==='ru'?'Русские субтитры найдены':'Есть субтитры на другом языке — при необходимости подготовить перевод',done:f.subs==='ru'}];}
function prepHtml(){const n=S.approved;if(!n)return noPlan();return `<div class="eyebrow">Ночь утверждена · демонстрационный план</div><div class="row between"><h1>Подготовить вечер</h1><button class="ghost" data-action="screen" data-screen="plan">Вернуться к подбору</button></div><p class="intro muted">${n.films.length} фильма · ${dur(n.total)} с перерывами. Здесь отмечается подготовка, а не просмотр.</p><div class="success">Состав ночи сохранён в этом браузере. Файлы макет не копирует и не удаляет.</div><div class="checklist">${n.films.map((id,i)=>{const f=byId(id);return `<article class="check-card"><div class="check-title"><span class="check-num">0${i+1}</span><div><h3>${esc(f.title)}</h3><div class="meta">${f.year} · ${esc(f.director)} · ${f.runtime} мин (${dur(f.runtime)})</div></div></div><div class="tasks">${prepTasks(f).map(t=>`<label><input type="checkbox" data-task="${id}:${t.key}" ${(n.tasks[id+':'+t.key]??t.done)?'checked':''}>${esc(t.text)}</label>`).join('')}</div></article>`;}).join('')}</div><div class="row between" style="margin-top:24px"><span class="muted">Можно подтвердить ночь заранее и вернуться к подготовке позже.</span><button class="primary" data-action="screen" data-screen="morning">Посмотреть утренний разбор →</button></div>`;}
function noPlan(){return `<div class="empty-plan"><h1>Сначала соберём ночь</h1><p>После утверждения здесь появится твой план.</p><button class="primary" data-action="screen" data-screen="plan">К подбору фильмов</button></div>`;}
function morningHtml(){const n=S.approved;if(!n)return noPlan();const answered=Object.keys(n.results).length;return `<div class="eyebrow">Утро после кино</div><h1>Как прошла ночь?</h1><p class="intro muted">Сначала фильмы утверждённого плана, в порядке просмотра. Отмечено ${answered} из ${n.films.length}.</p><div class="checklist">${n.films.map((id,i)=>{const f=byId(id),r=n.results[id];return `<article class="check-card"><div class="check-title"><span class="check-num">0${i+1}</span><div><h3>${esc(f.title)}</h3><div class="meta">${esc(f.director)} · ${f.runtime} мин (${dur(f.runtime)}) · утверждён на эту ночь</div></div></div><div class="result">${[['watched','Посмотрел'],['dropped','Бросил'],['skipped','Не посмотрел']].map(([v,l])=>`<button class="small ${r===v?'chosen':''}" data-action="result" data-id="${id}" data-result="${v}" aria-pressed="${r===v}">${l}</button>`).join('')}${r?`<button class="small ghost" data-action="undo-result" data-id="${id}">Отменить отметку</button>`:''}</div>${r?`<div class="review-detail">${r==='skipped'?'<span class="muted">Остался в очереди и «Ближайших». Можно предложить в следующую ночь. Оценка и перенос не требуются.</span>':`<div class="row"><label>Твоя оценка<select data-rating="${id}">${options([['','Без оценки'],...Array.from({length:10},(_,i)=>[i+1,`${i+1} / 10`])],n.ratings[id]||'')}</select></label><span class="muted">${f.available?'Задача: перенести просмотренные копии вручную.':'Файл не был найден на демонстрационных дисках.'}</span></div>`}</div>`:''}</article>`;}).join('')}</div><div class="section-heading" style="margin-top:30px"><h2>Ещё в папке «Сегодня»</h2><p class="muted">Эти фильмы не входили в утверждённую ночь.</p></div>${D.filter(f=>f.today&&!n.films.includes(f.id)).map(f=>`<div class="check-card"><h3>${esc(f.title)} (${f.year})</h3><div class="meta">Не входил в план этой ночи. Файл сам по себе не считается просмотренным.</div><div class="row" style="margin-top:12px">${[['watched','Посмотрел'],['dropped','Бросил']].map(([v,l])=>`<button class="small ${n.extraResults?.[f.id]===v?'chosen':''}" data-action="extra-result" data-id="${f.id}" data-result="${v}">${l}</button>`).join('')}${n.extraResults?.[f.id]?`<button class="small ghost" data-action="undo-extra" data-id="${f.id}">Отменить отметку</button>`:''}</div></div>`).join('')||'<p class="muted">Других демонстрационных фильмов в «Сегодня» нет.</p>'}${answered===n.films.length?'<div class="success">Ночь разобрана. Пропущенные фильмы остаются для другого вечера.</div>':''}<button class="ghost" style="margin-top:20px" data-action="screen" data-screen="prep">← К подготовке этой ночи</button>`;}
function render(){const screen=S.screen;document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><img class="logo" src="${LOGO}" alt="Movie Night"><button class="nav" data-short="Б" disabled>Библиотека</button><button class="nav" data-short="Бл" disabled>Ближайшие</button><button class="nav" data-short="↻" disabled>Пересмотреть</button><button class="nav ${screen==='morning'?'active':''}" data-short="У" data-action="screen" data-screen="morning">Утренний разбор</button><button class="nav" data-short="Д" disabled>Диски</button><button class="nav ${screen==='plan'?'active':''}" data-short="Н" data-action="screen" data-screen="plan">Собрать ночь</button><button class="nav ${screen==='prep'?'active':''}" data-short="✓" data-action="screen" data-screen="prep">Подготовка ночи</button><footer><strong>ИНТЕРАКТИВНЫЙ МАКЕТ</strong>Отдельный от приложения<br>Данные демонстрационные<br><button class="small ghost" style="margin-top:10px" data-action="reset">Сбросить пример</button></footer></aside><main class="main"><div class="demo">Макет для обсуждения. Фильмы, наличие файлов и личные характеристики показаны на примере; твоя настоящая библиотека не используется.</div><div class="steps">${[['plan','Подобрать'],['prep','Подготовить'],['morning','Разобрать утром']].map(([v,t],i)=>`<button class="step ${screen===v?'active':''}" data-action="screen" data-screen="${v}" ${v!=='plan'&&!S.approved?'disabled':''}><span>${i+1}</span>${t}</button>`).join('')}</div>${screen==='plan'?planHtml():screen==='prep'?prepHtml():morningHtml()}<div class="footer-note">Movie Night · концепт интерфейса. Все действия относятся только к этому макету. Изображения обложек заменены условными карточками для автономной работы.</div></main></div>${modalHtml()}`;persist();}
function modalHtml(){if(!modal)return '';let title='',body='';if(modal.type==='choose'){const i=modal.i,sl=S.slots[i],others=S.slots.filter((_,j)=>j!==i).map(s=>byId(s.film)).filter(Boolean);title=`Выбрать фильм · место ${i+1}`;const list=D.filter(f=>eligible(f,sl)&&!others.some(o=>o.id===f.id||!S.repeat&&o.director===f.director)&&(!chooserQuery||[f.title,f.director].join(' ').toLowerCase().includes(chooserQuery.toLowerCase())));body=`<p class="muted">Показаны фильмы под текущие условия слота. Ручной выбор закрепит фильм. Итоговое время проверяется перед утверждением.</p><input type="text" id="chooser-query" placeholder="Название или режиссёр" aria-label="Поиск фильма в макете" value="${esc(chooserQuery)}" style="margin-top:16px"><div class="choices">${list.map(f=>`<div class="choice"><div><h3>${esc(f.title)} <span class="muted">(${f.year})</span></h3><div class="meta">${esc(f.director)} · ${f.runtime} мин (${dur(f.runtime)}) · ${f.available?'На диске':'Нужно скачать'}</div><div class="meta">${esc(reason(f))}</div></div><button class="small primary" data-action="pick" data-id="${f.id}" data-i="${i}">Выбрать</button></div>`).join('')||'<div class="alert">Подходящих вариантов в демонстрационном наборе нет. Измени условия места или источники.</div>'}</div>`;}
if(modal.type==='favorites'){title='Мои любимые режиссёры';body=`<p class="muted">Отмечаешь сам. Средняя оценка не назначает и не снимает любимого режиссёра.</p><div class="favorites">${directors.map(d=>`<button class="small favorite ${S.favorites.includes(d)?'on':''}" data-action="favorite" data-director="${esc(d)}" aria-pressed="${S.favorites.includes(d)}">${S.favorites.includes(d)?'★':'☆'} ${esc(d)}</button>`).join('')}</div>`;}
if(modal.type==='tags'){const f=byId(modal.id);title='Мои отметки · '+f.title;body=`<p class="muted">В макете можно попробовать ручную правку. Она не меняет настоящую библиотеку и сбрасывается при перезагрузке файла.</p><div class="info-grid">${field('Эмоциональная нагрузка','tag-weight',[['light','Лёгкий'],['medium','Средний'],['heavy','Тяжёлый'],['unknown','Не определено']],f.weight)}${field('Требовательность к вниманию','tag-attention',[['easy','Без напряжения'],['medium','Средняя'],['focused','Требует внимания'],['unknown','Не определено']],f.attention)}${field('Стиль / направление','tag-style',[['none','Не отмечено'],['noir','Нуар'],['neonoir','Неонуар']],f.styles[0]||'none')}</div><p class="muted">Эти отметки задаёшь ты. Программа не определяет их по жанру или оценке.</p>`;}
if(modal.type==='template'){title='Сохранить настройки';body='<p class="muted">Сохраняются условия и источники, без конкретных фильмов. Шаблон останется только в этом браузере.</p><input type="text" id="template-name" aria-label="Название шаблона" maxlength="60" placeholder="Например: Вестерн и Азия" style="margin:18px 0"><button class="primary" data-action="confirm-template">Сохранить шаблон</button>';}
if(modal.type==='reset'){title='Начать заново?';body='<p class="muted" style="margin-bottom:20px">Будут сброшены только демонстрационный план, отметки утра и шаблоны этого макета. Настоящее приложение не затрагивается.</p><button class="primary" data-action="confirm-reset">Сбросить макет</button>';}
if(modal.type==='approve'){title=S.approved?'Заменить утверждённый план?':'Утвердить эту ночь?';body=`<p class="muted">${S.count} фильма · ${dur(total())} с перерывами.${S.approved?' Прежние демонстрационные отметки утра и подготовки будут очищены.':''} Само утверждение не означает просмотр.</p><div class="info-grid"><div class="info-box"><strong>${S.slots.filter(s=>byId(s.film)?.available).length}</strong><p class="muted">фильма уже на дисках</p></div><div class="info-box"><strong>${S.slots.filter(s=>!byId(s.film)?.available).length}</strong><p class="muted">нужно скачать</p></div></div><button class="primary" data-action="confirm-approve">Утвердить и открыть подготовку →</button>`;}
if(modal.type==='about'){title='Попробуй собрать свой вечер';body='<ol class="plain-list"><li>Поменяй источник, время и условия отдельных мест.</li><li>Нажми «Подобрать ночь» или выбери фильм вручную.</li><li>Закрепи один фильм и пересобери остальные.</li><li>Попробуй смесь: два из ближайших, два из остальной библиотеки.</li><li>Выбери конкретного режиссёра в одном месте.</li><li>Утверди ночь, проверь подготовку и перейди в утренний разбор.</li><li>Отметь «Не посмотрел» и попробуй отменить отметку.</li></ol><p class="muted">Демонстрационный подбор учитывает ограничения, но его небольшая библиотека не представляет все жанры и страны. Пропорции, перерывы, шкалы внимания и устройство экрана — предложения для обсуждения.</p>';}
return `<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row between" style="margin-bottom:18px"><h2>${esc(title)}</h2><button class="small ghost" data-action="close" aria-label="Закрыть окно">✕</button></div>${body}</section></div>`;}
function takeSettings(){const {count,limit,pause,source,nearCount,availability,mode,repeat,rewatch}=S;return {count,limit,pause,source,nearCount,availability,mode,repeat,rewatch,slots:S.slots.map(({film,locked,...filters})=>filters)};}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,i=Number(b.dataset.i),id=Number(b.dataset.id);if(a==='screen'){S.screen=b.dataset.screen;notice='';window.scrollTo(0,0);}if(a==='generate'){S.seed++;if(solve())toast('Ночь подобрана. Закреплённые фильмы сохранены.');}if(a==='lock'){S.slots[i].locked=!S.slots[i].locked;}if(a==='up'&&i>0){[S.slots[i-1],S.slots[i]]=[S.slots[i],S.slots[i-1]];}if(a==='replace'){S.seed++;if(solve(i))toast('Предложен другой фильм. Остальной план сохранён.');}if(a==='choose'){modal={type:'choose',i};chooserQuery='';}if(a==='pick'){S.slots[i].film=id;S.slots[i].locked=true;modal=null;notice='';}if(a==='favorites')modal={type:'favorites'};if(a==='favorite'){const d=b.dataset.director;S.favorites=S.favorites.includes(d)?S.favorites.filter(x=>x!==d):[...S.favorites,d];}if(a==='edit-tags')modal={type:'tags',id:S.slots[i].film};if(a==='save-template')modal={type:'template'};if(a==='confirm-template'){const name=document.getElementById('template-name').value.trim();if(!name){toast('Введи название шаблона.');return;}S.templates.push({name,settings:takeSettings()});modal=null;toast('Шаблон сохранён.');}if(a==='load-template'){const v=document.getElementById('template-select').value;if(v===''){toast('Выбери сохранённый шаблон.');return;}const t=S.templates[Number(v)].settings;Object.assign(S,JSON.parse(JSON.stringify(t)));S.slots=t.slots.map(s=>({...s,film:null,locked:false}));notice='';toast('Настройки применены. Теперь подбери фильмы.');}if(a==='approve'&&!problems().length)modal={type:'approve'};if(a==='confirm-approve'){if(problems().length){modal=null;notice=problems()[0];}else{S.approved={films:S.slots.map(s=>s.film),total:total(),results:{},ratings:{},tasks:{}};S.screen='prep';modal=null;window.scrollTo(0,0);}}if(a==='result'){S.approved.results[id]=b.dataset.result;if(b.dataset.result==='skipped')delete S.approved.ratings[id];}if(a==='extra-result'){S.approved.extraResults=S.approved.extraResults||{};S.approved.extraResults[id]=b.dataset.result;}if(a==='undo-extra')delete S.approved.extraResults[id];if(a==='undo-result'){delete S.approved.results[id];delete S.approved.ratings[id];}if(a==='about')modal={type:'about'};if(a==='reset')modal={type:'reset'};if(a==='confirm-reset'){S=fresh();modal=null;notice='';solve();}if(a==='close')modal=null;render();});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.task){S.approved.tasks[t.dataset.task]=t.checked;persist();return;}if(t.dataset.rating){const id=t.dataset.rating;if(t.value)S.approved.ratings[id]=Number(t.value);else delete S.approved.ratings[id];persist();return;}const k=t.dataset.setting;if(!k)return;if(t.type==='number'&&(!Number.isFinite(t.valueAsNumber)||!t.checkValidity())){toast('Введи корректный лимит от 0 до 1440 минут.');render();return;}if(k.startsWith('tag-')){const f=byId(modal.id);if(k==='tag-style')f.styles=t.value==='none'?[]:[t.value];else f[k==='tag-weight'?'weight':'attention']=t.value;render();return;}if(t.dataset.slot!==undefined){S.slots[Number(t.dataset.slot)][k]=t.value;}else{S[k]=t.type==='checkbox'?t.checked:['count','limit','pause','nearCount'].includes(k)?Number(t.value):t.value;if(k==='count'){const old=S.slots;S.slots=Array.from({length:S.count},(_,i)=>old[i]||{source:'inherit',region:'any',genre:'any',weight:'any',attention:'any',director:'any',film:null,locked:false});S.nearCount=Math.min(S.nearCount,S.count);}}notice='';render();});
document.addEventListener('input',e=>{if(e.target.dataset.setting==='limit'){const n=e.target.valueAsNumber;document.getElementById('limit-hours').textContent=Number.isFinite(n)&&n>=0&&n<=1440?(n?dur(n):'Без ограничения по времени'):'Введи число от 0 до 1440';}if(e.target.id==='chooser-query'){chooserQuery=e.target.value;const p=e.target.selectionStart;render();const input=document.getElementById('chooser-query');input.focus();input.setSelectionRange(p,p);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render();}});
if(!S.slots.some(s=>s.film))solve();render();
</script></body></html>
