name: Выпуск версии
# Новая версия выходит, когда в main меняется номер версии в package.json.
on:
  push:
    branches: [main]
    paths: [package.json]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить, выпущена ли версия
        id: check
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip == 'false'
        run: npm install
      - if: steps.check.outputs.skip == 'false'
        run: npm test
      - if: steps.check.outputs.skip == 'false'
        name: Собрать Windows без публикации
        run: npx electron-builder --win --publish never
      - if: steps.check.outputs.skip == 'false'
        name: Проверить запуск перед публикацией
        shell: bash
        timeout-minutes: 2
        run: |
          export MN_SMOKE="$(pwd -W)/smoke.txt" MN_USERDATA="$(pwd -W)/smoke-data"
          "dist/win-unpacked/Movie Night.exe" &
          app_pid=$!
          for i in $(seq 1 30); do [ -f smoke.txt ] && break; sleep 3; done
          cat smoke.txt || true
          cat smoke-data/movie-night.log || true
          grep -q "Подключим TMDB" smoke.txt
          grep -q "FFPROBE: ffprobe version" smoke.txt
          wait "$app_pid"
      - if: steps.check.outputs.skip == 'false'
        name: Опубликовать проверенное приложение
        run: npx electron-builder --win --prepackaged dist/win-unpacked --publish always
