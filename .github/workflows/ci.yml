name: Проверка
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx electron-builder --win --publish never
      - name: Запустить собранную программу
        shell: bash
        run: |
          export MN_SMOKE="$(pwd -W)/smoke.txt" MN_USERDATA="$(pwd -W)/smoke-data"
          "dist/win-unpacked/Movie Night.exe" &
          for i in $(seq 1 30); do [ -f smoke.txt ] && break; sleep 3; done
          cat smoke.txt || true
          cat smoke-data/movie-night.log || true
          grep -q "Подключим TMDB" smoke.txt
